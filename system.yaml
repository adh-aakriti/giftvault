# yaml-language-server: $schema=./system.schema.json
student: aadhikari.ieu2024
prefix: aadhikari-ieu2024
public_url: https://aadhikariieu2024ui.z28.web.core.windows.net
ui:
  path: ui
  storage_account: aadhikariieu2024ui
  calls: [ideas, occasions]
azure:
  resource_group: rg-aadhikari-ieu2024
  container_apps_environment: aadhikari-ieu2024-env
  sql_server: aadhikari-ieu2024-sql
  registry: ghcr.io/adh-aakriti
services:
  ideas:
    description: People, gift ideas with a priority, and tags. Owns the people table.
    path: services/ideas
    openapi: services/ideas/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/ideas/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: Connection string of the ideas database }
      DB_CONNECT_RETRY_S: { default: 90, description: How many seconds to keep retrying the database connection while a paused database resumes }
      UI_ORIGIN: { default: "http://localhost:8080", description: The only origin allowed to call this service from a browser (CORS) }
      GIT_SHA: { default: unknown, description: Git commit of the running image (shown by /health) }
    azure:
      container_app: aadhikari-ieu2024-ideas
      sql_database: aadhikari-ieu2024-ideas-db
  occasions:
    description: Dates worth remembering and the countdown to the next one.
    path: services/occasions
    openapi: services/occasions/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/occasions/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: Connection string of the occasions database }
      DB_CONNECT_RETRY_S: { default: 90, description: How many seconds to keep retrying the database connection while a paused database resumes }
      UI_ORIGIN: { default: "http://localhost:8080", description: The only origin allowed to call this service from a browser (CORS) }
      IDEAS_URL: { default: "http://ideas:8000", description: Base URL of the ideas service }
      IDEAS_TIMEOUT_S: { default: 3, description: Timeout in seconds for calls to the ideas service }
      GIT_SHA: { default: local, description: Git commit of the running image (shown by /health) }
    calls:
      - service: ideas
        url_env: IDEAS_URL
        endpoints: ["GET /people/{person_id}"]
        timeout_s: 3
        on_failure: Upcoming occasions are still listed, marked degraded, with the person's name and idea count empty. Creating an occasion returns 503 with a clear message, because the person cannot be verified.
    azure:
      container_app: aadhikari-ieu2024-occasions
      sql_database: aadhikari-ieu2024-occasions-db
