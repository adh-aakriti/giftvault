name: CI

on:
  push:
  pull_request:

env:
  COMPOSE_PROJECT_NAME: giftvault

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Lint both services
        run: ruff check services

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validators
        run: pip install check-jsonschema==0.39.0 openapi-spec-validator==0.9.0

      - name: Check system.yaml against the provided schema
        run: check-jsonschema --schemafile system.schema.json system.yaml

      - name: Check each OpenAPI document against the OpenAPI specification
        run: |
          for f in services/*/openapi.yaml; do
            openapi-spec-validator "$f"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ideas, occasions]
    steps:
      - uses: actions/checkout@v4

      - name: Create the environment file
        run: cp .env.example .env

      - name: Start SQL Server and create the databases
        run: docker compose run --rm db-init

      - name: Run the tests with coverage
        run: |
          set -a; . ./.env; set +a
          if [ "${{ matrix.service }}" = "ideas" ]; then DB_PWD="$IDEAS_PWD"; else DB_PWD="$OCCASIONS_PWD"; fi
          docker run --rm --network giftvault_default \
            -v "$PWD/services/${{ matrix.service }}:/app" -w /app \
            -e DATABASE_URL="mssql://${{ matrix.service }}_user:${DB_PWD}@sqlserver:1433/${{ matrix.service }}" \
            python:3.12-slim \
            sh -c "pip install -q -r requirements-dev.txt && pytest --cov=app --cov-report=term-missing --cov-fail-under=70"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the environment file
        run: cp .env.example .env

      - name: Start both services with their databases
        run: docker compose up -d --build ideas occasions

      - name: Wait for both services to answer /health
        run: |
          for port in 8001 8002; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/health" > /dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "port $port never became healthy"; exit 1; }
          done

      - name: Create a person, an idea and an occasion through the real services
        run: |
          set -euo pipefail
          H='Content-Type: application/json'
          U='X-User-Id: smoke-test'
          IDEAS=http://localhost:8001
          OCC=http://localhost:8002
          id=$(curl -fsS -X POST "$IDEAS/people" -H "$H" -H "$U" \
            -d '{"name":"Smoke Test"}' | jq -r .id)
          curl -fsS -X POST "$IDEAS/people/$id/ideas" -H "$H" -H "$U" \
            -d '{"note":"a smoke test idea"}' > /dev/null
          day=$(date -u -d tomorrow +%F)
          curl -fsS -X POST "$OCC/people/$id/occasions" -H "$H" -H "$U" \
            -d "{\"label\":\"smoke\",\"date\":\"$day\"}" > /dev/null
          curl -fsS "$OCC/upcoming" -H "$U" | tee upcoming.json
          jq -e '.degraded == false
            and .occasions[0].person_name == "Smoke Test"
            and .occasions[0].idea_count == 1' upcoming.json

      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  images:
    needs: [lint, validate, test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ideas, occasions]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          provenance: false
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/giftvault-${{ matrix.service }}:${{ github.sha }}
